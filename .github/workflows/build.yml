name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DualLink.sln
      - name: Test
        run: dotnet test DualLink.sln --configuration Release --no-restore
      - name: Build Windows application
        run: dotnet build src/DualLink.App/DualLink.App.csproj --configuration Release --no-restore
      - name: Publish self-contained app without executable packing
        run: dotnet publish src/DualLink.App/DualLink.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish
      - name: Download official Wintun
        shell: pwsh
        run: |
          if (-not (Test-Path publish/LinkWeaver.exe)) { throw 'LinkWeaver publish output is missing.' }
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          if ((Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower() -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') { throw 'Wintun checksum mismatch' }
          Expand-Archive wintun.zip -DestinationPath wintun
          $dll = Get-ChildItem wintun -Recurse -Filter wintun.dll | Where-Object { $_.FullName -match 'amd64' } | Select-Object -First 1
          $license = Get-ChildItem wintun -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if (-not $dll -or -not $license) { throw 'Official Wintun package layout is invalid' }
          Copy-Item $dll.FullName publish/wintun.dll
          Copy-Item $license.FullName publish/wintun-license.txt
      - name: Smoke-test Wintun adapter
        shell: pwsh
        run: |
          $process = Start-Process ./publish/LinkWeaver.exe -ArgumentList '--wintun-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA 'DualLink/duallink.log'
            if (Test-Path $log) { Get-Content $log }
            throw "Wintun smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Smoke-test main window startup
        shell: pwsh
        run: |
          $process = Start-Process ./publish/LinkWeaver.exe -ArgumentList '--ui-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA 'DualLink/duallink.log'
            if (Test-Path $log) { Get-Content $log }
            throw "LinkWeaver UI startup smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Add bundled Linux relay
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/relay | Out-Null
          dotnet publish src/DualLink.Relay/DualLink.Relay.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o publish/relay
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          foreach ($file in @('install-relay.sh', 'duallink-relay.service')) {
            $content = [IO.File]::ReadAllText("deploy/linux/$file").Replace("`r`n", "`n")
            [IO.File]::WriteAllText("publish/relay/$file", $content, $utf8NoBom)
          }
          if ([IO.File]::ReadAllText('publish/relay/install-relay.sh').Contains("`r")) { throw 'Linux installer contains CRLF' }
          $relayFiles = @('DualLink.Relay', 'install-relay.sh', 'duallink-relay.service')
          $relayHashes = foreach ($file in $relayFiles) {
            $hash = (Get-FileHash "publish/relay/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          [IO.File]::WriteAllLines((Join-Path $PWD 'publish/relay/SHA256SUMS.txt'), $relayHashes, (New-Object Text.UTF8Encoding($false)))
      - name: Sign application when a trusted certificate is configured
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          DUALLINK_SIGNING_PFX: ${{ secrets.DUALLINK_SIGNING_PFX }}
          DUALLINK_SIGNING_PASSWORD: ${{ secrets.DUALLINK_SIGNING_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DUALLINK_SIGNING_PFX)) {
            Write-Host 'No trusted signing certificate configured; producing an explicitly unsigned build.'
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP 'duallink-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:DUALLINK_SIGNING_PFX))
            & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:DUALLINK_SIGNING_PASSWORD publish/LinkWeaver.exe
            if ($LASTEXITCODE -ne 0) { throw 'Application signing failed.' }
            & signtool verify /pa /all /v publish/LinkWeaver.exe
            if ($LASTEXITCODE -ne 0) { throw 'Application signature verification failed.' }
          } finally {
            Remove-Item $certificate -Force -ErrorAction SilentlyContinue
          }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc installer/DualLink.iss
      - name: Sign installer when a trusted certificate is configured
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          DUALLINK_SIGNING_PFX: ${{ secrets.DUALLINK_SIGNING_PFX }}
          DUALLINK_SIGNING_PASSWORD: ${{ secrets.DUALLINK_SIGNING_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DUALLINK_SIGNING_PFX)) { exit 0 }
          $certificate = Join-Path $env:RUNNER_TEMP 'duallink-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:DUALLINK_SIGNING_PFX))
            & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:DUALLINK_SIGNING_PASSWORD artifacts/LinkWeaver-Setup-x64.exe
            if ($LASTEXITCODE -ne 0) { throw 'Installer signing failed.' }
            & signtool verify /pa /all /v artifacts/LinkWeaver-Setup-x64.exe
            if ($LASTEXITCODE -ne 0) { throw 'Installer signature verification failed.' }
          } finally {
            Remove-Item $certificate -Force -ErrorAction SilentlyContinue
          }
      - name: Package standalone relay
        shell: pwsh
        run: Compress-Archive -Path publish/relay/* -DestinationPath artifacts/DualLink-Relay-linux-x64.zip -Force
      - name: Generate release checksums
        shell: pwsh
        run: |
          $files = @('LinkWeaver-Setup-x64.exe', 'DualLink-Relay-linux-x64.zip')
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash "artifacts/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          [IO.File]::WriteAllLines((Join-Path $PWD 'artifacts/SHA256SUMS.txt'), $lines, (New-Object Text.UTF8Encoding($false)))
          Get-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: LinkWeaver-Setup-x64
          path: |
            artifacts/LinkWeaver-Setup-x64.exe
            artifacts/DualLink-Relay-linux-x64.zip
            artifacts/SHA256SUMS.txt
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Test shared protocol
        run: dotnet test tests/DualLink.Tests/DualLink.Tests.csproj -c Release
      - name: Publish Linux relay
        run: dotnet publish src/DualLink.Relay/DualLink.Relay.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o relay-package
      - name: Smoke-test Linux TUN relay
        run: |
          if [ ! -c /dev/net/tun ]; then
            echo '/dev/net/tun unavailable on runner; skipping runtime smoke test'
            exit 0
          fi
          sudo timeout --kill-after=2s 5s ./relay-package/DualLink.Relay --tun-smoke > relay-smoke.log 2>&1
          cat relay-smoke.log
          sudo ip link delete dlbond0 2>/dev/null || true
          grep -q 'DualLink TUN full-duplex smoke test passed' relay-smoke.log
      - name: Add deployment files
        run: |
          cp deploy/linux/install-relay.sh relay-package/
          cp deploy/linux/duallink-relay.service relay-package/
          chmod +x relay-package/install-relay.sh relay-package/DualLink.Relay
      - uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: DualLink-Relay-linux-x64
          path: relay-package/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, relay]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: LinkWeaver-Setup-x64
          path: artifacts
      - name: Verify release tag matches application version
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v2.2.9"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "LinkWeaver 2.2.9 — Traffic-Verified Adapter Health"
          files: |
            artifacts/LinkWeaver-Setup-x64.exe
            artifacts/DualLink-Relay-linux-x64.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
