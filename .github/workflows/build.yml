name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DualLink.sln
      - name: Test
        run: dotnet test DualLink.sln --configuration Release --no-restore
      - name: Build Windows application
        run: dotnet build src/DualLink.App/DualLink.App.csproj --configuration Release --no-restore
      - name: Publish self-contained app
        run: dotnet publish src/DualLink.App/DualLink.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Download official Wintun
        shell: pwsh
        run: |
          if (-not (Test-Path publish/DualLink.exe)) { dotnet publish src/DualLink.App/DualLink.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish }
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          if ((Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower() -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') { throw 'Wintun checksum mismatch' }
          Expand-Archive wintun.zip -DestinationPath wintun
          $dll = Get-ChildItem wintun -Recurse -Filter wintun.dll | Where-Object { $_.FullName -match 'amd64' } | Select-Object -First 1
          $license = Get-ChildItem wintun -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if (-not $dll -or -not $license) { throw 'Official Wintun package layout is invalid' }
          Copy-Item $dll.FullName publish/wintun.dll
          Copy-Item $license.FullName publish/wintun-license.txt
      - name: Smoke-test Wintun adapter
        shell: pwsh
        run: |
          $process = Start-Process ./publish/DualLink.exe -ArgumentList '--wintun-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA 'DualLink/duallink.log'
            if (Test-Path $log) { Get-Content $log }
            throw "Wintun smoke test failed with exit code $($process.ExitCode)"
          }
      - name: Add bundled Linux relay
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/relay | Out-Null
          dotnet publish src/DualLink.Relay/DualLink.Relay.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o publish/relay
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          foreach ($file in @('install-relay.sh', 'duallink-relay.service')) {
            $content = [IO.File]::ReadAllText("deploy/linux/$file").Replace("`r`n", "`n")
            [IO.File]::WriteAllText("publish/relay/$file", $content, $utf8NoBom)
          }
          if ([IO.File]::ReadAllText('publish/relay/install-relay.sh').Contains("`r")) { throw 'Linux installer contains CRLF' }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc installer/DualLink.iss
      - name: Package standalone relay
        shell: pwsh
        run: Compress-Archive -Path publish/relay/* -DestinationPath artifacts/DualLink-Relay-linux-x64.zip -Force
      - name: Generate release checksums
        shell: pwsh
        run: |
          $files = @('DualLink-Setup-x64.exe', 'DualLink-Relay-linux-x64.zip')
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash "artifacts/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          [IO.File]::WriteAllLines((Join-Path $PWD 'artifacts/SHA256SUMS.txt'), $lines, (New-Object Text.UTF8Encoding($false)))
          Get-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        with:
          name: DualLink-Setup-x64
          path: |
            artifacts/DualLink-Setup-x64.exe
            artifacts/SHA256SUMS.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Release DualLink 2.1.0'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: "DualLink 2.1.0 — Traffic History & UI Refinement"
          files: |
            artifacts/DualLink-Setup-x64.exe
            artifacts/DualLink-Relay-linux-x64.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Test shared protocol
        run: dotnet test tests/DualLink.Tests/DualLink.Tests.csproj -c Release
      - name: Publish Linux relay
        run: dotnet publish src/DualLink.Relay/DualLink.Relay.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o relay-package
      - name: Smoke-test Linux TUN relay
        run: |
          if [ ! -c /dev/net/tun ]; then
            echo '/dev/net/tun unavailable on runner; skipping runtime smoke test'
            exit 0
          fi
          sudo timeout --kill-after=2s 5s ./relay-package/DualLink.Relay --tun-smoke > relay-smoke.log 2>&1
          cat relay-smoke.log
          sudo ip link delete dlbond0 2>/dev/null || true
          grep -q 'DualLink TUN full-duplex smoke test passed' relay-smoke.log
      - name: Add deployment files
        run: |
          cp deploy/linux/install-relay.sh relay-package/
          cp deploy/linux/duallink-relay.service relay-package/
          chmod +x relay-package/install-relay.sh relay-package/DualLink.Relay
      - uses: actions/upload-artifact@v5
        with:
          name: DualLink-Relay-linux-x64
          path: relay-package/
