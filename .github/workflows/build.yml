name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DualLink.sln
      - name: Test
        run: dotnet test DualLink.sln --configuration Release --no-restore
      - name: Publish self-contained app
        run: dotnet publish src/DualLink.App/DualLink.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Download official Wintun
        shell: pwsh
        run: |
          if (-not (Test-Path publish/DualLink.exe)) { dotnet publish src/DualLink.App/DualLink.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish }
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          if ((Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower() -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') { throw 'Wintun checksum mismatch' }
          Expand-Archive wintun.zip -DestinationPath wintun
          $dll = Get-ChildItem wintun -Recurse -Filter wintun.dll | Where-Object { $_.FullName -match 'amd64' } | Select-Object -First 1
          $license = Get-ChildItem wintun -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if (-not $dll -or -not $license) { throw 'Official Wintun package layout is invalid' }
          Copy-Item $dll.FullName publish/wintun.dll
          Copy-Item $license.FullName publish/wintun-license.txt
      - name: Add bundled Linux relay
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/relay | Out-Null
          dotnet publish src/DualLink.Relay/DualLink.Relay.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o publish/relay
          Copy-Item deploy/linux/install-relay.sh publish/relay/
          Copy-Item deploy/linux/duallink-relay.service publish/relay/
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc installer/DualLink.iss
      - uses: actions/upload-artifact@v5
        with:
          name: DualLink-Setup-x64
          path: artifacts/DualLink-Setup-x64.exe
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/DualLink-Setup-x64.exe
          generate_release_notes: true
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Test shared protocol
        run: dotnet test tests/DualLink.Tests/DualLink.Tests.csproj -c Release
      - name: Publish Linux relay
        run: dotnet publish src/DualLink.Relay/DualLink.Relay.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o relay-package
      - name: Add deployment files
        run: |
          cp deploy/linux/install-relay.sh relay-package/
          cp deploy/linux/duallink-relay.service relay-package/
          chmod +x relay-package/install-relay.sh relay-package/DualLink.Relay
      - uses: actions/upload-artifact@v5
        with:
          name: DualLink-Relay-linux-x64
          path: relay-package/
